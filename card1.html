<!DOCTYPE html>
<html lang="id">

<head>
  <title>Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="chaos-layer"></div>
  <div class="win-window">
    <div class="win-titlebar"><span>🖼️ Scrapbook.exe</span>
      <div class="win-controls"><span>X</span></div>
    </div>
    <div class="win-content">

      <div class="gallery-container">
        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/1.jpeg" alt="Foto 1">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/2.jpeg" alt="Foto 2">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/3.jpeg" alt="Foto 3">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/4.jpeg" alt="Foto 4">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/5.jpeg" alt="Foto 5">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/6.jpeg" alt="Foto 6">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/7.jpeg" alt="Foto 7">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/8.jpeg" alt="Foto 8">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/9.jpeg" alt="Foto 9">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/10.jpeg" alt="Foto 10">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/11.jpeg" alt="Foto 11">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/12.jpeg" alt="Foto 12">
        </div>

        <div class="y2k-polaroid" onclick="toggleZoom(this)">
          <img src="img/13.jpeg" alt="Foto 13">
        </div>

      </div>

      <br>
      <p style="font-family: 'VT323'; font-size: 0.9rem;">*Tap photo to zoom!*</p>
      <a href="menu.html" class="btn">Back</a>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    function toggleZoom(element) {
      // Cek apakah layar kecil (Mobile)
      if (window.innerWidth <= 768) {
        // Jika foto ini sudah di-zoom, kembalikan normal
        if (element.classList.contains('zoomed')) {
          element.classList.remove('zoomed');
        } else {
          // Jika belum, reset semua foto lain dulu
          document.querySelectorAll('.y2k-polaroid').forEach(el => el.classList.remove('zoomed'));
          // Lalu zoom foto yang ini
          element.classList.add('zoomed');
        }
      }
    }
  </script>
</body>

</html>
